services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: deck
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: deck
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "deck"], interval: 5s, retries: 10 }
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://deck:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/deck
    depends_on: { db: { condition: service_healthy } }
    ports: ["8787:8787"]
volumes:
  pgdata:
